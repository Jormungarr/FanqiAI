<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Fanqi 人机对战</title>
  <style>
    body{font-family:system-ui,Segoe UI,Arial;margin:16px}
    .board{display:grid;grid-template-columns:repeat(8,56px);gap:6px;margin-top:12px}
    .cell{width:56px;height:56px;display:flex;align-items:center;justify-content:center;border:1px solid #ccc;font-weight:700;user-select:none}
    .R{background:#ffecec;color:#900}
    .B{background:#ecf0ff;color:#034}
    .empty{background:#fafafa;border-color:#eee}
    .hidden{background:#444;color:#888;border-color:#555}
    .clickable{cursor:pointer}
    .mine{cursor:pointer;box-shadow:0 0 0 2px #4a9}
    .target{cursor:pointer;background:#ffe9a8 !important;border-color:#c90 !important}
    .attack{cursor:pointer;background:#ffb3b3 !important;border-color:#c00 !important}
    .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .status{margin:10px 0;font-weight:600;font-size:15px}
    .advice{margin-top:10px;font-size:13px}
    .adv-item{padding:6px 8px;margin:3px 0;border:1px solid #ddd;border-radius:6px;cursor:pointer;background:#fafafa}
    .adv-item:hover{border-color:#4a9;background:#eefaf3}
    .adv-top{border-color:#c90;background:#fff7e0;font-weight:600}
    .log{margin-top:12px;font-family:monospace;font-size:13px;background:#f7f7f7;padding:8px;border:1px solid #eee;max-height:260px;overflow:auto;white-space:pre-wrap}
  </style>
</head>
<body>
  <h2>Fanqi 人机对战 <a href="game.html" style="font-size:14px">对战·指导一体 →</a> <a href="index.html" style="font-size:14px">回放查看器 →</a></h2>
  <div class="controls">
    <button id="newGame">新对局</button>
    <select id="agentSel">
      <option value="mcts">AI: MCTS(强)</option>
      <option value="prefer">AI: 偏好策略</option>
      <option value="random">AI: 随机</option>
    </select>
    <label>纵向 <input id="vertical" type="checkbox" checked></label>
    <button id="adviseBtn">💡 建议</button>
    <span id="info"></span>
  </div>
  <div id="status" class="status">加载中…</div>
  <div id="board" class="board"></div>
  <div id="advice" class="advice"></div>
  <div id="log" class="log"></div>

  <script>
    const boardEl = document.getElementById('board');
    const infoEl = document.getElementById('info');
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');

    let S = null;          // 服务器返回的当前对局状态
    let selected = -1;     // 选中的己方棋子索引
    let legalMoves = [];   // 选中棋子的合法走法 [{dst,type}]
    let advice = null;     // 建议列表 [{action,text,win_rate,visits}]
    let busy = false;      // 请求进行中,禁止点击

    const PIECE_CN = {
      'RJ':'帅','RS':'仕','RX':'相','RR':'车','RN':'马','RC':'炮','RP':'兵',
      'BJ':'将','BS':'士','BX':'象','BR':'车','BN':'马','BC':'炮','BP':'卒'
    };
    const COLOR_CN = {R:'红方', B:'黑方'};

    async function api(path, body){
      const resp = await fetch(path, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body || {})
      });
      return resp.json();
    }

    async function newGame(){
      busy = true; selected = -1; legalMoves = []; advice = null;
      S = await api('/api/new', {agent: document.getElementById('agentSel').value});
      busy = false;
      render();
    }

    function myTurn(){ return !S.over && S.turn === S.human_color; }

    function isHidden(i){ return S.board[i] === 'H'; }
    function isMine(i){
      const c = S.board[i];
      return typeof c === 'string' && c.indexOf(':') > 0 && c.startsWith(S.human_color);
    }

    function render(){
      infoEl.textContent = '你执 ' + COLOR_CN[S.human_color] + ' | 红余:' + S.scores.R + ' 黑余:' + S.scores.B;
      document.getElementById('adviseBtn').disabled = !(myTurn() && !busy);
      if(S.over){
        if(S.winner === 'DRAW') statusEl.textContent = '和棋(连续30步无吃子)';
        else if(S.winner === S.human_color) statusEl.textContent = '🎉 你赢了!点「新对局」再来一局';
        else if(S.winner === null) statusEl.textContent = '对局结束(无胜负)';
        else statusEl.textContent = 'AI(' + COLOR_CN[S.winner] + ')获胜,点「新对局」再战';
      } else {
        statusEl.textContent = (S.turn === S.human_color) ? '轮到你走子' : 'AI 思考中…';
      }

      // 转置(纵向)渲染:4行8列 → 4列8行,新第i格对应原 (i%4)行 *8 + floor(i/4)列
      const vertical = document.getElementById('vertical').checked;
      const order = [];
      for(let i=0;i<32;i++){
        order.push(vertical ? ((i%4)*8 + Math.floor(i/4)) : i);
      }
      boardEl.style.gridTemplateColumns = 'repeat(' + (vertical?4:8) + ',56px)';
      boardEl.innerHTML = '';

      const clickable = myTurn() && !busy;
      for(let i=0;i<32;i++){
        const orig = order[i];
        const d = document.createElement('div');
        d.className = 'cell';
        const c = S.board[orig];
        if(c === '.'){
          d.classList.add('empty');
          if(clickable && selected >= 0){
            // 空格可能是选中棋子的移动目标
            const lm = legalMoves.find(m => m.dst === orig);
            if(lm){
              d.classList.add(lm.type === 'cannon' ? 'attack' : 'target');
              d.addEventListener('click', ()=>doMove(lm, orig));
            }
          }
        } else if(c === 'H'){
          d.classList.add('hidden');
          d.textContent = '■';
          if(clickable){
            // 暗棋可能是炮击目标:选中炮时优先炮击,否则翻棋
            const lm = selected >= 0 ? legalMoves.find(m => m.dst === orig) : null;
            if(lm){
              d.classList.add(lm.type === 'cannon' ? 'attack' : 'target');
              d.addEventListener('click', ()=>doMove(lm, orig));
            } else {
              d.classList.add('clickable');
              d.addEventListener('click', ()=>doFlip(orig));
            }
          }
        } else {
          const parts = c.split(':');
          d.classList.add(parts[0]);
          d.textContent = PIECE_CN[parts[0]+parts[1]] || (parts[0]+parts[1]);
          if(clickable){
            if(isMine(orig)){
              d.classList.add('mine');
              d.addEventListener('click', ()=>selectPiece(orig));
            } else if(selected >= 0){
              const lm = legalMoves.find(m => m.dst === orig);
              if(lm){
                d.classList.add(lm.type === 'cannon' ? 'attack' : 'target');
                d.addEventListener('click', ()=>doMove(lm, orig));
              }
            }
          }
        }
        boardEl.appendChild(d);
      }

      logEl.textContent = S.history.map((h,i) => {
        let t = (i+1) + '. ' + h.text;
        if(h.revealed){
          const k = h.revealed.replace(':','');
          const cn = (h.revealed[0]==='R'?'红':'黑') + (PIECE_CN[k] || k);
          t += (h.action && h.action[0] === 'flip') ? (' → ' + cn) : (' 翻出' + cn);
        }
        if(h.reason && h.reason !== 'move' && h.reason !== 'flip') t += ' [' + h.reason + ']';
        return t;
      }).join('\n');
      renderAdvice();
    }

    async function askAdvice(){
      if(!myTurn() || busy) return;
      busy = true;
      const r = await api('/api/advise', {});
      busy = false;
      if(r.error){ alert(r.error); advice = null; }
      else { advice = r.moves; }
      render();
    }

    function renderAdvice(){
      const el = document.getElementById('advice');
      if(!advice || !advice.length){ el.innerHTML = ''; return; }
      el.innerHTML = '<div style="font-weight:600;margin-bottom:4px">💡 建议(胜率由模拟对局统计,点击可直接走):</div>' +
        advice.map((m,i)=>{
          return '<div class="adv-item' + (i===0?' adv-top':'') + '" data-i="' + i + '">' +
            (i+1) + '. ' + m.text + ' — 胜率 ' + (m.win_rate*100).toFixed(1) + '% (' + m.visits + '次模拟)</div>';
        }).join('');
      el.querySelectorAll('.adv-item').forEach(d=>{
        d.onclick = ()=>{
          const m = advice[parseInt(d.dataset.i, 10)];
          if(m && myTurn() && !busy) execAction(m.action);
        };
      });
    }

    async function execAction(action){
      busy = true;
      const r = await api('/api/move', {action: action});
      if(r.error){ alert(r.error); }
      else { S = r; }
      selected = -1; legalMoves = []; advice = null;
      busy = false;
      render();
    }

    async function doFlip(idx){
      busy = true;
      const r = await api('/api/move', {action:['flip', idx]});
      if(r.error){ alert(r.error); }
      else { S = r; selected = -1; legalMoves = []; }
      advice = null;
      busy = false;
      render();
    }

    async function selectPiece(src){
      if(selected === src){ selected = -1; legalMoves = []; render(); return; }
      busy = true;
      const r = await api('/api/legal', {src: src});
      if(r.error){ alert(r.error); selected = -1; }
      else { selected = src; legalMoves = r.moves || []; }
      busy = false;
      render();
    }

    async function doMove(lm, dst){
      busy = true;
      const r = await api('/api/move', {action:[lm.type, selected, dst]});
      if(r.error){ alert(r.error); }
      else { S = r; }
      selected = -1; legalMoves = []; advice = null;
      busy = false;
      render();
    }

    document.getElementById('newGame').onclick = newGame;
    document.getElementById('agentSel').onchange = newGame;
    document.getElementById('vertical').onchange = render;
    document.getElementById('adviseBtn').onclick = askAdvice;
    newGame();
  </script>
</body>
</html>
