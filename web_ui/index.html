<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Fanqi Replay Viewer</title>
  <style>
    body{font-family:system-ui,Segoe UI,Arial;margin:16px}
    .board{display:grid;grid-template-columns:repeat(8,56px);gap:6px;margin-top:12px}
    .cell{width:56px;height:56px;display:flex;align-items:center;justify-content:center;border:1px solid #ccc;font-weight:700}
    .R{background:#ffecec;color:#900}
    .B{background:#ecf0ff;color:#034}
    .empty{background:#fafafa;border-color:#eee}
    .hidden{background:#444;color:#888;border-color:#555}
    .controls{display:flex;gap:8px;align-items:center}
  </style>
</head>
<body>
  <h2>Fanqi 回放查看器 <a href="play.html" style="font-size:14px">去人机对战 →</a></h2>
  <div class="controls">
    <input id="file" type="file" accept="application/json">
    <button id="loadSample">加载内置示例</button>
    <button id="play">Play</button>
    <button id="pause">Pause</button>
    <button id="step">Step</button>
    <label>纵向 <input id="vertical" type="checkbox" checked></label>
    <label>Speed <input id="speed" type="range" min="50" max="2000" value="500"></label>
    <span id="info"></span>
  </div>
  <div id="debug" style="margin-top:10px;font-family:monospace;white-space:pre-wrap;background:#f7f7f7;padding:8px;border:1px solid #eee;max-height:240px;overflow:auto"></div>
  <div id="board" class="board"></div>

  <script>
    const boardEl = document.getElementById('board');
    const info = document.getElementById('info');
    const fileInput = document.getElementById('file');
    const loadSample = document.getElementById('loadSample');
    const playBtn = document.getElementById('play');
    const pauseBtn = document.getElementById('pause');
    const stepBtn = document.getElementById('step');
    const speed = document.getElementById('speed');

    let states = [];
    let idx = 0; let timer = null; let delay = 500;

    function renderState(s){
      if(!s) return;
      boardEl.innerHTML='';
      let arr = Array.isArray(s.board) ? s.board.slice() : [];
      // ensure length == 32
      if(arr.length < 32){
        const pad = new Array(32 - arr.length).fill('.');
        arr = arr.concat(pad);
      } else if(arr.length > 32){
        arr = arr.slice(0,32);
      }
      const vertical = document.getElementById('vertical').checked;
      if(vertical){
        // transpose 4x8 -> 8x4
        const t = [];
        for(let c=0;c<8;c++){
          for(let r=0;r<4;r++) t.push(arr[r*8 + c]);
        }
        arr = t;
        boardEl.style.gridTemplateColumns = 'repeat(4,56px)';
      } else {
        boardEl.style.gridTemplateColumns = 'repeat(8,56px)';
      }
      arr.forEach(cell=>{
        const d=document.createElement('div'); d.className='cell';
        // normalize cell to string (treat null/undefined/non-string as empty)
        const cellStr = (typeof cell === 'string') ? cell : (cell == null ? '.' : String(cell));
        if(cellStr === '.'){
          d.classList.add('empty'); d.textContent='';
        } else {
          const parts = cellStr.split(':');
          const col = parts[0] || '';
          const pt = parts[1] || '';
          const rev = parts[2] || '0';
          if(rev === '0'){
            d.classList.add('hidden'); d.textContent='■';
          } else {
            if(col) d.classList.add(col);
            d.textContent = col + pt;
          }
        }
        boardEl.appendChild(d);
      });
      info.textContent = `step ${s.step} ${s.player} ${s.action} scores R/B:${s.scores.R}/${s.scores.B}`;
      updateDebug();
    }

    function step(){
      if(idx>=states.length) { clearInterval(timer); timer=null; info.textContent = `播放完毕，共 ${states.length} 步。再点 Play 可重新播放`; return; }
      try{
        renderState(states[idx]);
      }catch(err){
        const dbg = document.getElementById('debug');
        if(dbg) dbg.textContent += '\nRENDER_ERROR at step '+idx+': '+ (err && err.stack ? err.stack : String(err));
        console.error('render error', err);
      }
      idx++;
    }

    playBtn.onclick = ()=>{ if(timer) clearInterval(timer); if(idx>=states.length){ idx=0; } timer=setInterval(step,delay); };
    pauseBtn.onclick = ()=>{ if(timer) clearInterval(timer); timer=null; };
    stepBtn.onclick = ()=>{ pauseBtn.click(); step(); };
    speed.oninput = ()=>{ delay = parseInt(speed.value); if(timer){ clearInterval(timer); timer=setInterval(step,delay);} };

    fileInput.onchange = e=>{
      const f = e.target.files[0]; if(!f) return;
      const reader = new FileReader();
      reader.onload = ev=>{ try{ let rep = JSON.parse(ev.target.result); if(rep && rep.moves) { window._kifu_meta = rep.meta || {}; rep = rep.moves; } else { window._kifu_meta = {}; } prepareStatesFromReplay(rep); idx=0; try{ renderState(states[0]); }catch(err){ const dbg=document.getElementById('debug'); if(dbg) dbg.textContent += '\nRENDER_ERROR initial: '+(err && err.stack?err.stack:String(err)); console.error(err);} }catch(err){ alert('无法解析 JSON'); }};
      reader.readAsText(f);
    };

    loadSample.onclick = async ()=>{
      let rep = null;
      for(const p of ['../replay_samples/generated_replay.json', '../replay_samples/test_replay.json']){
        try{
          const resp = await fetch(p);
          if(resp.ok){ rep = await resp.json(); break; }
        }catch(e){ /* ignore, try next */ }
      }
      let note = '';
      if(!rep){ rep = EMBEDDED_SAMPLE; note = EMBEDDED_NOTE; window._kifu_meta = {}; }
      else if(rep && rep.moves){ window._kifu_meta = rep.meta || {}; rep = rep.moves; }
      else { window._kifu_meta = {}; }
      prepareStatesFromReplay(rep); idx=0;
      try{ renderState(states[0]); }catch(err){ console.error('render error', err); }
      if(note){ info.textContent = note + '（共 ' + states.length + ' 步）'; }
    };

    function prepareStatesFromReplay(rep){
      states = [];
      let prev = new Array(32).fill('.');
      for(let i=0;i<rep.length;i++){
        const s = rep[i];
        let board = Array.isArray(s && s.board) ? s.board.slice() : [];
        // sanitize entries: ensure each cell is a string ('.' for empty/null)
        board = board.map(c => (typeof c === 'string' ? c : (c == null ? '.' : String(c))));
        if(board.length !== 32){
          // fallback to previous board if available, else pad
          if(prev && prev.length===32){
            board = prev.slice();
          } else {
            board = board.concat(new Array(Math.max(0,32-board.length)).fill('.'));
          }
        }
        prev = board.slice();
        states.push({step:i, player:s.player, action: JSON.stringify(s.action), scores:s.scores || {R:0,B:0}, board:board});
      }
      if(states.length===0){
        // ensure at least one state for UI
        states.push({step:0,player:'',action:'',scores:{R:0,B:0},board:prev});
      }
      updateDebug();
    }


    function updateDebug(){
      const dbg = document.getElementById('debug');
      if(!dbg) return;
      const lines = [];
      const meta = window._kifu_meta || {};
      if(meta && meta.winner){
        lines.push(`meta.winner: ${meta.winner}`);
      }
      lines.push(`states: ${states.length}`);
      lines.push(`current idx: ${idx} (0-based)`);
      // show first 12 steps summary of board lengths
      const maxShow = Math.min(12, states.length);
      for(let i=0;i<maxShow;i++){
        const b = Array.isArray(states[i].board) ? states[i].board.length : 0;
        lines.push(`step ${i}: board_len=${b}`);
      }
      if(states.length>maxShow) lines.push(`... (${states.length-maxShow} more steps)`);
      dbg.textContent = lines.join('\n');
    }
